<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GPUse — Log in</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/auth.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
  <div class="wrap">

    <header class="nav">
      <a class="logo" href="index.html"><span>GPU</span>se</a>
      <nav class="nav-links">
        <a href="browse.html">Browse GPUs</a>
        <a href="create.html">Create</a>
        <a href="my-jobs.html">My jobs</a>
        <a href="host.html">Host</a>
      </nav>
      <a class="btn" href="signup.html">Create account</a>
    </header>

    <main class="auth-wrap">
      <form class="panel auth-panel">
        <h1>Welcome back</h1>
        <p class="sub">Log in to run jobs, download results and manage your GPUs.</p>

        <div class="field-group">
          <label class="flabel" for="email">EMAIL</label>
          <input class="field" id="email" type="email" placeholder="you@example.com" required>
        </div>

        <div class="field-group">
          <label class="flabel" for="password">PASSWORD</label>
          <input class="field" id="password" type="password" placeholder="••••••••" required>
        </div>

        <a class="forgot" href="#">Forgot your password?</a>

        <button class="btn-primary btn-block" type="submit">Log in</button>

        <p class="switch">New to GPUse? <a href="signup.html">Create an account</a></p>
      </form>
    </main>

    <footer>
      <p>GPUse — Make anything. Powered by idle GPUs.</p>
      <p>Help · Terms · Privacy</p>
    </footer>

  </div>
</body>
</html>
